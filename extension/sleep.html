<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <title>Sleeping lil</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      :root {
        color-scheme: light dark;
      }
      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        background: #1a1a1e;
      }
      body {
        cursor: pointer;
        user-select: none;
        -webkit-user-select: none;
      }

      /* Full-bleed screenshot underlay. */
      #shot {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: top center;
        filter: saturate(0.9);
      }

      /* Tinted overlay. Color set at runtime from ?tint; default purple. */
      #tint {
        position: fixed;
        inset: 0;
        background: rgba(88, 60, 140, 0.55);
        backdrop-filter: blur(2px) saturate(0.9);
        -webkit-backdrop-filter: blur(2px) saturate(0.9);
      }

      /* Centered badge. */
      #center {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
      }
      .badge {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 14px;
        padding: 30px 40px 26px;
        border-radius: 26px;
        background: rgba(255, 255, 255, 0.94);
        box-shadow: 0 18px 60px rgba(0, 0, 0, 0.4), 0 0 0 0.5px rgba(0, 0, 0, 0.08);
        text-align: center;
        max-width: 80vw;
        animation: rise 420ms cubic-bezier(0.22, 1, 0.36, 1) both;
      }
      @keyframes rise {
        from {
          opacity: 0;
          transform: translateY(10px) scale(0.98);
        }
        to {
          opacity: 1;
          transform: none;
        }
      }
      /* The mascot PNG has a WHITE background, so it sits inside a white/near-white
         rounded square that blends into the badge. */
      .mascot-wrap {
        width: 108px;
        height: 108px;
        border-radius: 22px;
        background: #ffffff;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        box-shadow: inset 0 0 0 0.5px rgba(0, 0, 0, 0.06);
      }
      .mascot-wrap img {
        width: 96px;
        height: 96px;
        object-fit: contain;
        image-rendering: -webkit-optimize-contrast;
      }
      .title {
        font-size: 17px;
        font-weight: 650;
        color: #1c1c1e;
        letter-spacing: 0.1px;
      }
      .hint {
        font-size: 13px;
        color: rgba(60, 60, 67, 0.6);
        font-weight: 500;
      }

      @media (prefers-color-scheme: dark) {
        .badge {
          background: rgba(38, 38, 42, 0.94);
          box-shadow: 0 18px 60px rgba(0, 0, 0, 0.6), 0 0 0 0.5px rgba(255, 255, 255, 0.08);
        }
        /* Keep the mascot square light so the white-bg PNG never shows a seam. */
        .mascot-wrap {
          background: #f4f4f6;
          box-shadow: inset 0 0 0 0.5px rgba(0, 0, 0, 0.12);
        }
        .title {
          color: #f2f2f7;
        }
        .hint {
          color: rgba(235, 235, 245, 0.6);
        }
      }
    </style>
  </head>
  <body>
    <img id="shot" alt="" />
    <div id="tint"></div>
    <div id="center">
      <div class="badge" role="status" aria-live="polite">
        <div class="mascot-wrap">
          <img id="mascot" src="assets/sleeping-lil.png" alt="Sleeping lil" />
        </div>
        <div class="title">This lil is sleeping</div>
        <div class="hint">click anywhere to wake</div>
      </div>
    </div>
    <script src="sleep.js"></script>
  </body>
</html>
